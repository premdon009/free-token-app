# SINGLE SOURCE for the paid section. docs/paid/*.md is generated from this file.
# After editing: uv run python scripts/gen_plans.py
#
# This file NEVER feeds the router: router/litellm.yaml and configs/ come from providers.yml only.
#
# Rules (see AGENTS.md):
#   - pricing_source must be the vendor's OWN pricing page; last_verified is the day you read it.
#   - Every tier quotes its limits from the plan page. If the page doesn't say, write "not stated".
#   - trains_on_prompts: "yes" | "no" | "opt-out" | "unknown"   (quote it: bare yes/no become booleans)
#   - api_access:        "yes" | "no" | "limited" | "unknown"   (can the plan be used as an API key / through a router?)
#   - Telecom-sentinel or any real data never goes to a plan whose trains_on_prompts is not "no".
#
# Field reference:
#   kind:     subscription | payg | harness      (harness = coding-tool plan, page "Coding tools")
#   status:   active | unclear | retired
#   tiers[]:  name, usd_month, inr_month, models, limits (required), tools[]   (subscription, harness)
#   models[]: id, role (orchestrator | worker), input, output (required, $ per 1M tokens),
#             cached_input, context, tools (true/false)                         (payg)
#   payg:     endpoint (openai | anthropic | both | native), base_url, fees
#   optional: byok, terms_source, docs_url, region_notes, notes

# ───────────────────────────── Pay per token ─────────────────────────────

- id: anthropic-api
  name: Anthropic API
  vendor: Anthropic
  kind: payg
  status: active
  endpoint: anthropic
  base_url: https://api.anthropic.com
  pricing_source: https://platform.claude.com/docs/en/about-claude/pricing
  terms_source: https://www.anthropic.com/legal/commercial-terms
  trains_on_prompts: "no"
  api_access: "yes"
  last_verified: 2026-11-20
  notes: >-
    Commercial terms say Anthropic "may not train models on Customer Content". Haiku 5.5's price is for
    prompts up to 100K tokens; above that it is $0.50 input, $0.05 cached, $2.50 output.
    Claude Code can run on this key instead of a subscription.
  models:
    - {id: claude-fable-5-2, role: orchestrator, input: 8, cached_input: 0.20, output: 40, context: 1000000, tools: true}
    - {id: claude-opus-5-5, role: orchestrator, input: 4, cached_input: 0.20, output: 20, context: 1000000, tools: true}
    - {id: claude-sonnet-5-5, role: orchestrator, input: 2, cached_input: 0.10, output: 10, context: 1000000, tools: true}
    - {id: claude-haiku-5-5, role: worker, input: 0.10, cached_input: 0.01, output: 0.50, tools: true}

