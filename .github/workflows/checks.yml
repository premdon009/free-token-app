name: checks

on:
  pull_request:
  schedule:
    - cron: "30 3 * * 1"   # Mondays 03:30 UTC (09:00 IST)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run python scripts/pin_image.py --check
      - run: uv run python scripts/check_links.py

  weekly:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - name: Run checks (keep going on failure)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports
          { echo "## Links"; echo '```'; uv run python scripts/check_links.py --stale 2>&1 || echo "exit $?"; echo '```'; } > reports/links.md
          { echo "## Keyless endpoints"; echo '```'; uv run python scripts/probe_keys.py --keyless 2>&1 || echo "exit $?"; echo '```'; } > reports/keyless.md
          { echo "## LiteLLM pin"; echo '```'; uv run python scripts/pin_image.py --check --advisories 2>&1 || echo "exit $?"; echo '```'; } > reports/pin.md
          uv run python scripts/diff_upstream.py -o reports/upstream.md || echo "diff_upstream exit $?" > reports/upstream.md
          cat reports/pin.md reports/links.md reports/keyless.md reports/upstream.md > reports/weekly.md
      - name: Update the rolling "Weekly check" issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Run $(date -u +%F): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; echo; cat reports/weekly.md; } > reports/body.md
          n=$(gh issue list --state open --search 'in:title "Weekly check"' --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue edit "$n" --body-file reports/body.md
            gh issue comment "$n" --body "Updated for $(date -u +%F)."
          else
            gh issue create --title "Weekly check" --body-file reports/body.md
          fi
