# SINGLE SOURCE OF TRUTH. Catalog pages, router/litellm.yaml and configs/ are generated from this file.
# After editing: uv run python scripts/gen_catalog.py && uv run python scripts/gen_router.py
#
# Rules (see AGENTS.md):
#   - limits_source must be the provider's OWN page that shows the limits; last_verified is the day you read it.
#   - trains_on_prompts: "yes" | "no" | "opt-out" | "unknown"  (quote it: bare yes/no become booleans in YAML)
#   - free/private lane only uses providers with trains_on_prompts "no".
#
# Field reference:
#   kind:       provider | inference | aggregator | local
#   free_type:  permanent | renewable-credit | trial | keyless | local
#   status:     active | unclear | retired
#   router.key_env       env var in router/.env holding this provider's key (omit for keyless/local)
#   router.base_url_env  env var holding the full base URL when it contains an account id
#   router.priority      lower = earlier in every lane it joins
#   models[].lanes       optional: restrict this model to these lanes
#   models[].litellm_model  optional: full LiteLLM model string (default "openai/<id>")

- id: groq
  name: Groq
  kind: inference
  free_type: permanent
  status: active
  card_required: false
  phone_required: false
  region_notes: ""
  api: openai
  base_url: https://api.groq.com/openai/v1
  signup_url: https://console.groq.com/keys
  docs_url: https://console.groq.com/docs/rate-limits
  limits_source: https://console.groq.com/docs/rate-limits
  limits: {rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000, text: "Per model, shared by all keys in one organization. 429 responses carry retry-after."}
  trains_on_prompts: "no"
  trains_source: https://console.groq.com/docs/legal/services-agreement
  commercial_use: "yes"
  models:
    - {id: openai/gpt-oss-120b, context: 131072, tools: true, vision: false}
    - {id: qwen/qwen3.8-27b, context: 131072, tools: true, vision: true}
    - {id: openai/gpt-oss-20b, context: 131072, tools: true, vision: false}
  router: {include: true, priority: 10, key_env: GROQ_API_KEY, lanes: [coding, fast, private]}
  upstream: {mnfst: Groq, mv: groq-free}
  last_verified: 2026-11-19
  notes: "Fastest free host. The safeguard classifier models have much lower limits (3 RPM) and are left out."

